name: Build Floating COPY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create complete project
        shell: python
        run: |
          from pathlib import Path

          files = {
          "settings.gradle": """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FloatingCopy'
          include ':app'
          """,

          "build.gradle": """
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """,

          "app/build.gradle": """
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.local.floatingcopy'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.local.floatingcopy'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """,

          "app/src/main/AndroidManifest.xml": """
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Floating COPY"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CopyService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="User-started floating button to copy user-saved plain text"/>
                  </service>
              </application>
          </manifest>
          """,

          "app/src/main/java/com/local/floatingcopy/MainActivity.java": """
          package com.local.floatingcopy;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import android.widget.*;

          public class MainActivity extends Activity {
              EditText text;

              void save() {
                  getSharedPreferences("data",0).edit()
                      .putString("text",text.getText().toString()).apply();
              }

              void button(LinearLayout layout,String title,Runnable action) {
                  Button b=new Button(this);
                  b.setText(title);
                  b.setOnClickListener(v->action.run());
                  layout.addView(b);
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout layout=new LinearLayout(this);
                  layout.setOrientation(1);
                  layout.setPadding(24,48,24,24);

                  TextView title=new TextView(this);
                  title.setText("Floating COPY");
                  title.setTextSize(24);
                  layout.addView(title);

                  text=new EditText(this);
                  text.setHint("Write ordinary text here");
                  text.setMinLines(4);
                  text.setGravity(48);
                  text.setText(
                      getSharedPreferences("data",0).getString("text","")
                  );
                  layout.addView(text);

                  button(layout,"1. Save text",()->{
                      save();
                      Toast.makeText(this,"Saved",0).show();
                  });

                  button(layout,"2. Allow overlay",()->{
                      startActivity(new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:"+getPackageName())
                      ));
                  });

                  button(layout,"3. Start floating COPY",()->{
                      save();
                      if(!Settings.canDrawOverlays(this)) {
                          Toast.makeText(
                              this,"Allow overlay first",1
                          ).show();
                          return;
                      }
                      if(Build.VERSION.SDK_INT>=33 &&
                          checkSelfPermission(
                              "android.permission.POST_NOTIFICATIONS"
                          )!=0) {
                          requestPermissions(new String[]{
                              "android.permission.POST_NOTIFICATIONS"
                          },1);
                      }
                      startForegroundService(
                          new Intent(this,CopyService.class)
                      );
                  });

                  button(layout,"Stop",()->{
                      stopService(new Intent(this,CopyService.class));
                  });

                  button(layout,"Delete saved text",()->{
                      text.setText("");
                      save();
                  });

                  TextView note=new TextView(this);
                  note.setText(
                      "Tap floating COPY, then Paste in another app. "
                      +"Drag COPY to move it. Do not store passwords or OTP."
                  );
                  layout.addView(note);

                  ScrollView scroll=new ScrollView(this);
                  scroll.addView(layout);
                  setContentView(scroll);
              }
          }
          """,

          "app/src/main/java/com/local/floatingcopy/CopyService.java": """
          package com.local.floatingcopy;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.graphics.PixelFormat;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;

          public class CopyService extends Service {
              WindowManager wm;
              Button button;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent,int flags,int id) {
                  if(intent!=null && "STOP".equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  if(!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  try {
                      showNotification();
                      if(button==null) showButton();
                  } catch(Exception e) {
                      Toast.makeText(
                          this,"Error: "+e.getMessage(),1
                      ).show();
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              void showNotification() {
                  NotificationManager nm=
                      getSystemService(NotificationManager.class);

                  nm.createNotificationChannel(
                      new NotificationChannel(
                          "copy","Floating COPY",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  );

                  PendingIntent open=PendingIntent.getActivity(
                      this,0,new Intent(this,MainActivity.class),
                      PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent stop=PendingIntent.getService(
                      this,1,
                      new Intent(this,CopyService.class).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification n=new Notification.Builder(this,"copy")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setContentTitle("Floating COPY is running")
                      .setContentText("Tap Stop to close")
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(new Notification.Action.Builder(
                          android.R.drawable.ic_menu_close_clear_cancel,
                          "Stop",stop
                      ).build())
                      .build();

                  if(Build.VERSION.SDK_INT>=34) {
                      startForeground(
                          1,n,ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      );
                  } else {
                      startForeground(1,n);
                  }
              }

              void showButton() {
                  wm=getSystemService(WindowManager.class);
                  button=new Button(this);
                  button.setText("COPY");

                  WindowManager.LayoutParams p=
                      new WindowManager.LayoutParams(
                          -2,-2,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  p.gravity=Gravity.TOP|Gravity.LEFT;
                  p.x=20;
                  p.y=220;

                  button.setOnClickListener(v->{
                      String value=getSharedPreferences("data",0)
                          .getString("text","");

                      if(value.isEmpty()) {
                          Toast.makeText(
                              this,"Save some text first",0
                          ).show();
                          return;
                      }

                      getSystemService(ClipboardManager.class)
                          .setPrimaryClip(
                              ClipData.newPlainText("Saved text",value)
                          );

                      Toast.makeText(this,"Copied",0).show();
                  });

                  button.setOnTouchListener(new View.OnTouchListener() {
                      float startX,startY;
                      int oldX,oldY;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v,MotionEvent e) {
                          switch(e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  startX=e.getRawX();
                                  startY=e.getRawY();
                                  oldX=p.x;
                                  oldY=p.y;
                                  moved=false;
                                  return true;

                              case MotionEvent.ACTION_MOVE:
                                  float dx=e.getRawX()-startX;
                                  float dy=e.getRawY()-startY;
                                  if(Math.abs(dx)+Math.abs(dy)>12) {
                                      moved=true;
                                  }
                                  if(moved) {
                                      p.x=Math.max(0,oldX+(int)dx);
                                      p.y=Math.max(0,oldY+(int)dy);
                                      wm.updateViewLayout(button,p);
                                  }
                                  return true;

                              case MotionEvent.ACTION_UP:
                                  if(!moved) v.performClick();
                                  return true;

                              case MotionEvent.ACTION_CANCEL:
                                  return true;
                          }
                          return false;
                      }
                  });

                  wm.addView(button,p);
              }

              @Override
              public void onDestroy() {
                  if(wm!=null && button!=null) {
                      try {
                          wm.removeView(button);
                      } catch(Exception ignored) {}
                      button=null;
                  }
                  stopForeground(true);
                  super.onDestroy();
              }
          }
          """
          }

          for name, content in files.items():
              path = Path("project") / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Floating-COPY-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
